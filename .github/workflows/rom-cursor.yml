name: ROM cursor patch (no game data)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  arm-regression:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements-romfix.txt
      - run: python -c "import unicorn"
      - run: python -m unittest discover -s tests -p 'test_rom_cursor.py' -v
