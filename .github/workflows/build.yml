name: Build and ROM-free tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake ninja-build pkg-config extra-cmake-modules libsdl2-dev qt6-base-dev qt6-base-private-dev qt6-multimedia-dev qt6-svg-dev libarchive-dev libenet-dev libzstd-dev libcurl4-openssl-dev libfaad-dev libpcap-dev libegl-dev libwayland-dev xdelta3
      - name: Build both applications and test
        run: scripts/build.sh
      - name: Launcher and two real emulator smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          SDL_AUDIODRIVER: dummy
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          build/bin/platinum-coop --data-dir /tmp/coop-ui --smoke-test /tmp/coop-ui.png
          python3 tests/smoke_emulator.py build/bin/melonDS-coop
      - name: Retain test logs and UI capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: |
            /tmp/coop-ui.png
            build/launcher/Testing/Temporary/LastTest.log
      - name: Build and verify single-file Bazzite installer
        run: |
          python3 scripts/make-installer.py --upstream .cache/project-pm --output /tmp/Pokemon-Platinum-Coop-Bazzite.run
          bash /tmp/Pokemon-Platinum-Coop-Bazzite.run --check
      - name: Retain installer with matching GPL source
        uses: actions/upload-artifact@v4
        with:
          name: Bazzite-Installer
          path: /tmp/Pokemon-Platinum-Coop-Bazzite.run
