name: Native platform builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-svg mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-enet mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-faad2
      - name: Build and native tests
        run: bash scripts/build.sh
      - name: Two real Windows emulator processes
        env:
          QT_QPA_PLATFORM: offscreen
          SDL_AUDIODRIVER: dummy
        run: python3 tests/smoke_emulator.py build/bin/melonDS-coop.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-build-evidence
          path: |
            build/launcher/Testing/Temporary/LastTest.log
