name: Native platform builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake ninja-build pkg-config extra-cmake-modules libsdl2-dev qt6-base-dev qt6-base-private-dev qt6-multimedia-dev qt6-svg-dev libarchive-dev libenet-dev libzstd-dev libcurl4-openssl-dev libfaad-dev libpcap-dev libegl-dev libwayland-dev xdelta3
      - name: Build and verify
        env:
          QT_QPA_PLATFORM: offscreen
          SDL_AUDIODRIVER: dummy
        run: |
          bash scripts/build.sh
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tests/smoke_emulator.py build/bin/melonDS-coop
          mkdir -p dist
          python3 scripts/make-installer.py --upstream .cache/project-pm --output dist/Pokemon-Platinum-Coop-Bazzite.run
          bash dist/Pokemon-Platinum-Coop-Bazzite.run --check
          python3 scripts/make-deb.py --upstream .cache/project-pm --output dist/Pokemon-Platinum-Coop-ZorinOS18-amd64.deb
      - name: Install and remove native Debian package
        env:
          QT_QPA_PLATFORM: offscreen
          SDL_AUDIODRIVER: dummy
        run: |
          sudo apt-get install -y ./dist/Pokemon-Platinum-Coop-ZorinOS18-amd64.deb
          /opt/pokemon-platinum-local-coop/project/build/bin/platinum-coop --data-dir "$RUNNER_TEMP/deb-profile" --smoke-test "$RUNNER_TEMP/deb-launcher.png"
          test -s "$RUNNER_TEMP/deb-launcher.png"
          sudo apt-get remove -y pokemon-platinum-local-coop
          test ! -f /opt/pokemon-platinum-local-coop/project/build/bin/platinum-coop
          test -d "$RUNNER_TEMP/deb-profile"
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-installers
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Linux-native-evidence
          path: build/launcher/Testing/Temporary/LastTest.log
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-svg mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-enet mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-faad2
      - name: Build and native tests
        run: bash scripts/build.sh
      - name: Two real Windows emulator processes
        env:
          QT_QPA_PLATFORM: offscreen
          SDL_AUDIODRIVER: dummy
        run: python3 tests/smoke_emulator.py build/bin/melonDS-coop.exe
      - name: Package standalone Windows applications
        run: |
          mkdir -p dist
          python3 scripts/package-windows.py --upstream .cache/project-pm --output dist/windows --prefix "$(cygpath -w "$MINGW_PREFIX")"
          # Validate with no MSYS2 runtime in PATH: the deployed application must be self-contained.
          python3 tests/test_windows_package.py dist/windows
      - name: Create per-user Windows installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $installDir = Join-Path $env:RUNNER_TEMP "Coop Setup Test"
          $profileDir = Join-Path $env:RUNNER_TEMP "Coop User Data"
          $setup = Start-Process -FilePath "dist/Pokemon-Platinum-Coop-Windows-Setup.exe" -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$installDir`"") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup failed: $($setup.ExitCode)" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:SDL_AUDIODRIVER = "dummy"
          $env:QT_LOGGING_TO_CONSOLE = "1"
          $smoke = Start-Process -FilePath "$installDir/project/build/bin/platinum-coop.exe" -ArgumentList @("--data-dir", "`"$profileDir`"", "--smoke-test", "`"$env:RUNNER_TEMP/setup-launcher.png`"") -Wait -PassThru
          if ($smoke.ExitCode -ne 0 -or !(Test-Path "$env:RUNNER_TEMP/setup-launcher.png")) { throw "Installed launcher failed: exit=$($smoke.ExitCode)" }
          $uninstall = Start-Process -FilePath "$installDir/unins000.exe" -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path "$installDir/project/build/bin/platinum-coop.exe")) { throw "Uninstall failed" }
          if (!(Test-Path "$profileDir")) { throw "Uninstall removed personal data" }
          Compress-Archive -Path dist/windows/* -DestinationPath dist/Pokemon-Platinum-Coop-Windows-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-installers
          path: |
            dist/Pokemon-Platinum-Coop-Windows-Setup.exe
            dist/Pokemon-Platinum-Coop-Windows-Portable.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-build-evidence
          path: |
            build/launcher/Testing/Temporary/LastTest.log
  release:
    needs: [linux, windows]
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-installers'
          path: release
          merge-multiple: true
      - name: Publish only after every platform build passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum * > SHA256SUMS
          if gh release view v0.2.0-alpha.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; preserving its assets.'
            exit 0
          fi
          gh release create v0.2.0-alpha.4 * --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title 'Pokémon Platinum Local Co-op 0.2.0 Alpha 4 — Bazzite, ZorinOS, Windows' \
            --notes-file ../docs/releases/v0.2.0-alpha.4.md
