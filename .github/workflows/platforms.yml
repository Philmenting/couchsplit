name: Native platform builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake ninja-build pkg-config extra-cmake-modules libsdl2-dev qt6-base-dev qt6-base-private-dev qt6-multimedia-dev qt6-svg-dev libarchive-dev libenet-dev libzstd-dev libcurl4-openssl-dev libfaad-dev libpcap-dev libegl-dev libwayland-dev xdelta3
      - name: ARM test dependency
        run: python -m pip install -r tests/requirements-romfix.txt
      - name: Build and verify
        env:
          QT_QPA_PLATFORM: offscreen
          SDL_AUDIODRIVER: dummy
        run: |
          bash scripts/build.sh
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tests/smoke_emulator.py build/bin/melonDS-coop
          mkdir -p dist
          python3 scripts/make-installer.py --upstream .cache/project-pm --output dist/Pokemon-Platinum-Coop-Bazzite.run
          bash dist/Pokemon-Platinum-Coop-Bazzite.run --check
          python3 scripts/make-deb.py --upstream .cache/project-pm --output dist/Pokemon-Platinum-Coop-ZorinOS18-amd64.deb
      - name: Install and remove native Debian package
        env:
          QT_QPA_PLATFORM: offscreen
          SDL_AUDIODRIVER: dummy
        run: |
          sudo apt-get install -y ./dist/Pokemon-Platinum-Coop-ZorinOS18-amd64.deb
          /opt/pokemon-platinum-local-coop/project/build/bin/platinum-coop --data-dir "$RUNNER_TEMP/deb-profile" --smoke-test "$RUNNER_TEMP/deb-launcher.png"
          test -s "$RUNNER_TEMP/deb-launcher.png"
          sudo apt-get remove -y pokemon-platinum-local-coop
          test ! -f /opt/pokemon-platinum-local-coop/project/build/bin/platinum-coop
          test -d "$RUNNER_TEMP/deb-profile"
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-installers
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Linux-native-evidence
          path: build/launcher/Testing/Temporary/LastTest.log
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-svg mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-enet mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-faad2
      - name: Build and native tests
        run: bash scripts/build.sh
      - name: Two real Windows emulator processes
        env:
          QT_QPA_PLATFORM: offscreen
          SDL_AUDIODRIVER: dummy
        run: python3 tests/smoke_emulator.py build/bin/melonDS-coop.exe
      - name: Package standalone Windows applications
        run: |
          mkdir -p dist
          python3 scripts/package-windows.py --upstream .cache/project-pm --output dist/windows --prefix "$(cygpath -w "$MINGW_PREFIX")"
          # Validate with no MSYS2 runtime in PATH: the deployed application must be self-contained.
          python3 tests/test_windows_package.py dist/windows
      - name: Create per-user Windows installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $installDir = Join-Path $env:RUNNER_TEMP "Coop Setup Test"
          $profileDir = Join-Path $env:RUNNER_TEMP "Coop User Data"
          $setup = Start-Process -FilePath "dist/Pokemon-Platinum-Coop-Windows-Setup.exe" -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$installDir`"") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup failed: $($setup.ExitCode)" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:SDL_AUDIODRIVER = "dummy"
          $env:QT_LOGGING_TO_CONSOLE = "1"
          $smoke = Start-Process -FilePath "$installDir/project/build/bin/platinum-coop.exe" -ArgumentList @("--data-dir", "`"$profileDir`"", "--smoke-test", "`"$env:RUNNER_TEMP/setup-launcher.png`"") -Wait -PassThru
          if ($smoke.ExitCode -ne 0 -or !(Test-Path "$env:RUNNER_TEMP/setup-launcher.png")) { throw "Installed launcher failed: exit=$($smoke.ExitCode)" }
          $uninstall = Start-Process -FilePath "$installDir/unins000.exe" -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path "$installDir/project/build/bin/platinum-coop.exe")) { throw "Uninstall failed" }
          if (!(Test-Path "$profileDir")) { throw "Uninstall removed personal data" }
          Compress-Archive -Path dist/windows/* -DestinationPath dist/Pokemon-Platinum-Coop-Windows-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-installers
          path: |
            dist/Pokemon-Platinum-Coop-Windows-Setup.exe
            dist/Pokemon-Platinum-Coop-Windows-Portable.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-build-evidence
          path: |
            build/launcher/Testing/Temporary/LastTest.log
  rom-corrections:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements-romfix.txt
      - run: python -c "import unicorn"
      - run: python -m unittest discover -s tests -p 'test_rom_*.py' -v
  release:
    needs: [linux, windows, rom-corrections]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-alpha7
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-installers'
          path: release
          merge-multiple: true
      - name: Package authored ROM tools and verify complete asset set
        run: |
          python3 scripts/package-rom-tools.py --output release/Pokemon-PM-ROM-Korrekturen.zip
          python3 - <<'PYVERIFY'
          import hashlib, pathlib, zipfile
          root = pathlib.Path('release')
          expected = {'Pokemon-Platinum-Coop-Bazzite.run', 'Pokemon-Platinum-Coop-ZorinOS18-amd64.deb',
                      'Pokemon-Platinum-Coop-Windows-Setup.exe', 'Pokemon-Platinum-Coop-Windows-Portable.zip',
                      'Pokemon-PM-ROM-Korrekturen.zip'}
          assert {p.name for p in root.iterdir()} == expected, 'Unexpected or missing release assets'
          for name in expected:
              assert (root/name).stat().st_size > 1000, name
          with zipfile.ZipFile(root/'Pokemon-PM-ROM-Korrekturen.zip') as archive:
              assert archive.testzip() is None
              assert not any(pathlib.Path(n).suffix.lower() in ('.nds','.srl','.sav','.rom','.bios','.exe','.dll')
                             for n in archive.namelist())
          (root/'SHA256SUMS').write_text(''.join(hashlib.sha256((root/n).read_bytes()).hexdigest()+'  '+n+'\n'
                                               for n in sorted(expected)))
          PYVERIFY
          bash release/Pokemon-Platinum-Coop-Bazzite.run --check
      - name: Publish Alpha 7 after every platform and ARM check passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.2.0-alpha.7
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish,assets > "$RUNNER_TEMP/existing-release.json"; then
            if [ "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["isDraft"])' "$RUNNER_TEMP/existing-release.json")" = False ]; then
              echo 'Published release already exists; preserving all existing assets.'
              exit 0
            fi
            python3 - "$RUNNER_TEMP/existing-release.json" > "$RUNNER_TEMP/missing-assets.txt" <<'PYRESUME'
          import json, os, pathlib, sys
          release = json.load(open(sys.argv[1]))
          assert release['targetCommitish'] == os.environ['GITHUB_SHA'], 'Draft belongs to another commit'
          local = {p.name: p.stat().st_size for p in pathlib.Path('release').iterdir()}
          remote = {a['name']: a['size'] for a in release['assets']}
          assert all(n in local and size == local[n] for n, size in remote.items()), 'Unexpected existing draft asset'
          for name in sorted(local.keys() - remote.keys()):
              print('release/' + name)
          PYRESUME
            while IFS= read -r asset; do
              gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY"
            done < "$RUNNER_TEMP/missing-assets.txt"
          else
            gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --draft --prerelease --title 'Pokémon Platinum Local Co-op 0.2.0 Alpha 7 — English & German launcher' \
              --notes-file docs/releases/v0.2.0-alpha.7.md
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/uploaded-assets.json"
          python3 - "$RUNNER_TEMP/uploaded-assets.json" <<'PYUPLOAD'
          import json, pathlib, sys
          local = {p.name: p.stat().st_size for p in pathlib.Path('release').iterdir()}
          remote = {a['name']: a['size'] for a in json.load(open(sys.argv[1]))['assets']}
          assert remote == local, 'Incomplete or mismatched draft uploads; leaving release as draft'
          PYUPLOAD
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
