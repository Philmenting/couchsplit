name: Release current Bazzite version
on:
  push:
    paths: ['.github/workflows/release-current.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency: release-current-bazzite
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified installer from its immutable build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38772106099 --repo "$GITHUB_REPOSITORY" --name Bazzite-Installer --dir release
          bash release/Pokemon-Platinum-Coop-Bazzite.run --check
          cd release
          sha256sum Pokemon-Platinum-Coop-Bazzite.run > SHA256SUMS
      - name: Publish alpha release at the tested source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0-alpha.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; preserving its assets.'
            exit 0
          fi
          gh release create v0.1.0-alpha.1 release/Pokemon-Platinum-Coop-Bazzite.run release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target 0bd97b9e737720a13a8b85f2992a16b38298f8b0 \
            --prerelease --title 'Pokémon Platinum Local Co-op 0.1.0 Alpha 1 — Bazzite' \
            --notes-file docs/releases/v0.1.0-alpha.1.md
